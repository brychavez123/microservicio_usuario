spring.application.name=ms-usuarios
server.port=8081

# Credenciales en db.properties (no se sube a Git) o en variables de entorno
spring.config.import=optional:file:./db.properties

# Oracle Cloud (Autonomous Database) con Wallet
spring.datasource.url=jdbc:oracle:thin:@${DB_TNS_NAME}?TNS_ADMIN=${DB_WALLET_PATH}
spring.datasource.username=${DB_USERNAME:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas se crean con el script db/01_usuarios.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.root=INFO
logging.level.com.duoc=DEBUG
logging.level.org.springframework.security=INFO

management.endpoints.web.exposure.include=health,info
