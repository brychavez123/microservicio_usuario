name: Publicar en ECR y desplegar en EC2

# Cada push a main: tests -> imagen Docker en Amazon ECR -> despliegue en la EC2 por Systems Manager
# (con rollback) -> prueba de humo desde internet a través de Nginx.
# Configuración del servicio (nombre, puertos y rutas de prueba): aws/servicio.env
# La EC2 se crea con la plantilla ec2/foro-ec2-stack.yml del repo frontend_foro.
#
# Secrets del repo:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
# Variables del repo: EC2_INSTANCE_ID, AWS_REGION (opcional), AWS_ACCOUNT_ID (opcional)
#   y en los microservicios: ORACLE_CREDENTIALS_SECRET_ARN, ORACLE_WALLET_S3_BUCKET, ORACLE_WALLET_S3_KEY

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-aws-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Tests y publicación en ECR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    outputs:
      image: ${{ steps.imagen.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer configuración del servicio
        run: grep -E '^[A-Z_]+=' aws/servicio.env >> "$GITHUB_ENV"

      - name: Instalar Java 21
        if: hashFiles('pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests (Maven)
        if: hashFiles('pom.xml') != ''
        run: |
          sed -i 's/\r$//' mvnw && chmod +x mvnw
          ./mvnw -B -q verify

      - name: Instalar Node 22
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar Angular
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npx ng build --configuration production

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar la cuenta AWS
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          cuenta="$(aws sts get-caller-identity --query Account --output text)"
          if [[ -n "$EXPECTED_AWS_ACCOUNT_ID" && "$cuenta" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::Las credenciales son de la cuenta $cuenta y no de $EXPECTED_AWS_ACCOUNT_ID."; exit 1
          fi
          echo "Cuenta AWS: $cuenta"

      - name: Crear el repositorio ECR si no existe
        run: |
          aws ecr describe-repositories --repository-names "$SERVICE_NAME" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$SERVICE_NAME" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 >/dev/null

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ¿Ya existe la imagen de este commit?
        id: existe
        run: |
          if aws ecr describe-images --repository-name "$SERVICE_NAME" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "si=true" >> "$GITHUB_OUTPUT"; echo "La imagen ya existe; se reutiliza."
          else
            echo "si=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existe.outputs.si != 'true'

      - name: Construir y publicar la imagen
        if: steps.existe.outputs.si != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Referencia de la imagen
        id: imagen
        run: echo "image=${{ steps.ecr.outputs.registry }}/${SERVICE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Despliegue en EC2 (Systems Manager)
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: foro-ec2-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SECRET_ARN: ${{ vars.ORACLE_CREDENTIALS_SECRET_ARN }}
      WALLET_BUCKET: ${{ vars.ORACLE_WALLET_S3_BUCKET }}
      WALLET_KEY: ${{ vars.ORACLE_WALLET_S3_KEY }}
      IMAGE_URI: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer configuración del servicio
        run: grep -E '^[A-Z_]+=' aws/servicio.env >> "$GITHUB_ENV"

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar variables
        run: |
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "::error::Crea la variable EC2_INSTANCE_ID (Settings > Secrets and variables > Actions > Variables)."; exit 1
          fi
          if [[ "$NEEDS_DB" == "true" ]]; then
            [[ "$SECRET_ARN" =~ ^arn:aws:secretsmanager: ]] || { echo "::error::Falta la variable ORACLE_CREDENTIALS_SECRET_ARN."; exit 1; }
            [[ -n "$WALLET_BUCKET" && -n "$WALLET_KEY" ]] || { echo "::error::Faltan ORACLE_WALLET_S3_BUCKET y ORACLE_WALLET_S3_KEY."; exit 1; }
          else
            SECRET_ARN=""; WALLET_BUCKET=""; WALLET_KEY=""
            echo "SECRET_ARN=" >> "$GITHUB_ENV"; echo "WALLET_BUCKET=" >> "$GITHUB_ENV"; echo "WALLET_KEY=" >> "$GITHUB_ENV"
          fi

      - name: Desplegar y probar
        run: |
          script_b64="$(base64 -w0 aws/deploy-ec2.sh)"
          comando="echo $script_b64 | base64 -d > /tmp/deploy-$SERVICE_NAME.sh && bash /tmp/deploy-$SERVICE_NAME.sh '$SERVICE_NAME' '$IMAGE_URI' '$HOST_PORT' '$CONTAINER_PORT' '$HEALTH_PATH' '$AWS_REGION' '$SECRET_ARN' '$WALLET_BUCKET' '$WALLET_KEY'"
          jq -n --arg c "$comando" '{commands: [$c]}' > params.json

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $SERVICE_NAME ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"

          # Espera hasta 10 minutos (descarga de la imagen + arranque de Spring Boot)
          for i in $(seq 1 120); do
            sleep 5
            resultado="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" 2>/dev/null || echo '{"Status":"Pending"}')"
            estado="$(echo "$resultado" | jq -r '.Status')"
            [[ "$estado" =~ ^(Pending|InProgress|Delayed)$ ]] || break
          done
          echo "$resultado" | jq -r '.StandardOutputContent'
          echo "$resultado" | jq -r '.StandardErrorContent' >&2
          estado="$(echo "$resultado" | jq -r '.Status')"
          echo "Estado: $estado"
          [[ "$estado" == "Success" ]]

      - name: Prueba de humo desde internet (a través de Nginx)
        run: |
          ip="$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
          if [[ ! "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::La EC2 no tiene IP pública."; exit 1
          fi
          url="http://$ip${PUBLIC_SMOKE_PATH:-/}"
          codigo=""
          for i in $(seq 1 12); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            # 401/403 también prueban que la ruta llega al microservicio (endpoint protegido)
            [[ "$codigo" =~ ^(200|401|403)$ ]] && break
            sleep 5
          done
          if [[ ! "$codigo" =~ ^(200|401|403)$ ]]; then
            echo "::error::$url respondió HTTP ${codigo:-sin respuesta}. Revisa Nginx y el Security Group."; exit 1
          fi
          echo "OK: $url respondió HTTP $codigo"
          {
            echo "### ✅ $SERVICE_NAME desplegado"
            echo "- Sitio: http://$ip/"
            echo "- Prueba: $url → HTTP $codigo"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Website: http://$ip/"
