name: Check AWS deployment prerequisites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Inspect AWS deployment prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inspect AWS account and deployment resources
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Could not determine the AWS account ID."
            exit 1
          fi
          if [[ -n "$EXPECTED_AWS_ACCOUNT_ID" && "$account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::Credentials point to account $account_id, not the configured account."
            exit 1
          fi
          echo "AWS account: $account_id"
          echo "AWS Region: $AWS_REGION"

          failed=0

          check_read() {
            label="$1"
            shift
            if output="$("$@" 2>&1)"; then
              echo "=== $label ==="
              echo "$output"
            else
              status=$?
              echo "::error::$label failed (exit $status)"
              echo "$output"
              failed=1
            fi
          }

          check_read "ECS clusters" aws ecs list-clusters \
            --region "$AWS_REGION" --query clusterArns --output json
          check_read "ECR repositories" aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --query 'repositories[].{Name:repositoryName,URI:repositoryUri}' --output json
          check_read "Default VPC" aws ec2 describe-vpcs \
            --region "$AWS_REGION" --filters Name=isDefault,Values=true \
            --query 'Vpcs[].{VpcId:VpcId,CidrBlock:CidrBlock,State:State}' --output json
          check_read "Default subnets" aws ec2 describe-subnets \
            --region "$AWS_REGION" --filters Name=default-for-az,Values=true \
            --query 'Subnets[].{SubnetId:SubnetId,VpcId:VpcId,AvailabilityZone:AvailabilityZone,MapPublicIpOnLaunch:MapPublicIpOnLaunch}' \
            --output json

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Preflight could not inspect one or more AWS resources. No resources were created or changed."
            exit 1
          fi
